name: CX3-010C Story Sequence

on:
  pull_request:

permissions:
  contents: read

jobs:
  story-sequence:
    name: Telegram STORY_SEQUENCE recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: CX3-010C Story Sequence recovery
        run: node scripts/cx3-010c-story-sequence-e2e.mjs
