name: Dependency security CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  locked-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce clean production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lockfile hash
        run: sha256sum package-lock.json
