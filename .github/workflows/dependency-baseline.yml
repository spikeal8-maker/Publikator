name: Dependency baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile resolves
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce clean production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lockfile hash
        run: sha256sum package-lock.json
      - name: Commit generated lockfile on reproducibility branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v083-reproducible-builds'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo 'package-lock.json already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(rc): lock npm dependency graph'
          git push origin HEAD:${GITHUB_HEAD_REF}
