name: Runtime reliability CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime-reliability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Queue catch-up, blocked AT and Telegram length E2E
        run: node scripts/runtime-reliability-e2e.mjs
      - name: Atomic publication claim concurrency E2E
        run: node scripts/publication-concurrency-e2e.mjs
