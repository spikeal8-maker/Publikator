name: Toolchain CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pinned-production-toolchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Exact dependency install
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify pinned Docker base
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'node:22.23.2-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5' Dockerfile
          sha256sum package-lock.json
      - name: Build production image
        run: docker build --pull=false -t publikator-toolchain-ci .
      - name: Verify runtime Node and non-root user
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint node publikator-toolchain-ci --version)" = 'v22.23.2'
          RUNTIME_UID="$(docker run --rm --entrypoint node publikator-toolchain-ci -e 'process.stdout.write(String(process.getuid?.() ?? -1))')"
          test "$RUNTIME_UID" != '0'
          test "$RUNTIME_UID" != '-1'
          echo "Runtime uid: $RUNTIME_UID"
