name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node --check public/app.js
      - run: node --check public/post-editor-v04.js
      - run: node --check public/backups-v06.js
      - name: Legacy SQLite migration test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/publikator-legacy
          mkdir -p /tmp/publikator-legacy
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          const database = new Database('/tmp/publikator-legacy/publikator.sqlite');
          database.exec(`
            CREATE TABLE media (
              id TEXT PRIMARY KEY,
              post_id TEXT NOT NULL,
              original_name TEXT NOT NULL,
              relative_path TEXT NOT NULL,
              mime_type TEXT NOT NULL,
              size_bytes INTEGER NOT NULL,
              width INTEGER,
              height INTEGER,
              sha256 TEXT NOT NULL,
              created_at TEXT NOT NULL
            );
          `);
          const insert = database.prepare('INSERT INTO media (id,post_id,original_name,relative_path,mime_type,size_bytes,width,height,sha256,created_at) VALUES (?,?,?,?,?,?,?,?,?,?)');
          insert.run('old-2','post-old','second.jpg','post-old/second.jpg','image/jpeg',10,20,20,'sha2','2026-01-02T00:00:00.000Z');
          insert.run('old-1','post-old','first.jpg','post-old/first.jpg','image/jpeg',10,20,20,'sha1','2026-01-01T00:00:00.000Z');
          database.close();
          NODE
          DATA_DIR=/tmp/publikator-legacy \
          ADMIN_PASSWORD=ci-password \
          APP_MASTER_KEY=ci-master-key-that-is-longer-than-32-characters \
          node --input-type=module <<'NODE'
          const module = await import('./dist/db.js');
          module.migrate();
          const columns = module.db.prepare('PRAGMA table_info(media)').all().map((column) => column.name);
          if (!columns.includes('sort_order')) throw new Error('sort_order migration missing');
          const rows = module.db.prepare('SELECT id,sort_order FROM media WHERE post_id=? ORDER BY sort_order').all('post-old');
          if (rows.length !== 2 || rows[0].id !== 'old-1' || rows[0].sort_order !== 0 || rows[1].id !== 'old-2' || rows[1].sort_order !== 1) {
            throw new Error(`legacy order migration failed: ${JSON.stringify(rows)}`);
          }
          const schemaVersion = Number(module.db.pragma('user_version', { simple: true }));
          if (schemaVersion !== 1) throw new Error(`unexpected schema version ${schemaVersion}`);
          module.db.close();
          NODE
      - run: docker build -t publikator-ci .
      - name: Runtime, media and full restore smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name publikator-smoke --restart unless-stopped -p 18080:8080 \
            -e ADMIN_PASSWORD=ci-password \
            -e APP_MASTER_KEY=ci-master-key-that-is-longer-than-32-characters \
            publikator-ci

          cleanup() {
            docker rm -f publikator-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_for_health() {
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then
                return 0
              fi
              sleep 1
            done
            docker logs publikator-smoke
            return 1
          }

          wait_for_health

          login() {
            rm -f /tmp/publikator-cookies.txt
            curl -fsS -c /tmp/publikator-cookies.txt \
              -H 'content-type: application/json' \
              -d '{"password":"ci-password"}' \
              http://127.0.0.1:18080/api/auth/login | jq -e '.ok == true'
          }

          login
          PROJECT_ID="$(curl -fsS -b /tmp/publikator-cookies.txt http://127.0.0.1:18080/api/projects | jq -er '.[0].id')"

          OLD_POST_ID="$(curl -fsS -b /tmp/publikator-cookies.txt \
            -H 'content-type: application/json' \
            -d "{\"projectId\":\"${PROJECT_ID}\",\"title\":\"Before account\",\"body\":\"Must not auto-target future accounts\",\"scheduleMode\":\"MANUAL\"}" \
            http://127.0.0.1:18080/api/posts | jq -er '.id')"

          curl -fsS -b /tmp/publikator-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"platform":"telegram","name":"CI target","credentials":{"botToken":"fake-token","chatId":"@fake-channel"}}' \
            http://127.0.0.1:18080/api/accounts | jq -e '.id != null'

          curl -fsS -b /tmp/publikator-cookies.txt \
            "http://127.0.0.1:18080/api/posts/${OLD_POST_ID}" | \
            jq -e '(.targets | length) == 1 and (.targets[0].enabled == 0)'

          POST_ID="$(curl -fsS -b /tmp/publikator-cookies.txt \
            -H 'content-type: application/json' \
            -d "{\"projectId\":\"${PROJECT_ID}\",\"title\":\"CI post\",\"body\":\"Smoke test body\",\"scheduleMode\":\"MANUAL\"}" \
            http://127.0.0.1:18080/api/posts | jq -er '.id')"

          TARGET_ID="$(curl -fsS -b /tmp/publikator-cookies.txt \
            "http://127.0.0.1:18080/api/posts/${POST_ID}" | jq -er '.targets[0].id')"

          curl -fsS -b /tmp/publikator-cookies.txt \
            -X PATCH \
            -H 'content-type: application/json' \
            -d '{"text":"Telegram CI override"}' \
            "http://127.0.0.1:18080/api/posts/${POST_ID}/targets/${TARGET_ID}/text" | \
            jq -e '.ok == true and .target.overrideText == "Telegram CI override" and .target.resolvedText == "Telegram CI override"'

          node --input-type=module -e "import sharp from 'sharp'; await sharp({create:{width:16,height:16,channels:3,background:{r:255,g:255,b:255}}}).png().toFile('/tmp/publikator-white.png'); await sharp({create:{width:32,height:16,channels:3,background:{r:0,g:0,b:0}}}).png().toFile('/tmp/publikator-black.png'); await sharp({create:{width:24,height:24,channels:3,background:{r:255,g:200,b:0}}}).png().toFile('/tmp/publikator-yellow.png')"

          MEDIA_1="$(curl -fsS -b /tmp/publikator-cookies.txt \
            -F 'file=@/tmp/publikator-white.png;type=image/png' \
            "http://127.0.0.1:18080/api/posts/${POST_ID}/media" | jq -er '.id')"
          MEDIA_2="$(curl -fsS -b /tmp/publikator-cookies.txt \
            -F 'file=@/tmp/publikator-black.png;type=image/png' \
            "http://127.0.0.1:18080/api/posts/${POST_ID}/media" | jq -er '.id')"

          DUPLICATE_ID="$(curl -fsS -b /tmp/publikator-cookies.txt \
            -F 'file=@/tmp/publikator-white.png;type=image/png' \
            "http://127.0.0.1:18080/api/posts/${POST_ID}/media" | jq -er '.id')"
          test "$DUPLICATE_ID" = "$MEDIA_1"

          curl -fsS -b /tmp/publikator-cookies.txt \
            "http://127.0.0.1:18080/api/posts/${POST_ID}" | \
            jq -e --arg first "$MEDIA_1" --arg second "$MEDIA_2" '(.media | length) == 2 and .media[0].id == $first and .media[0].sort_order == 0 and .media[1].id == $second and .media[1].sort_order == 1'

          curl -fsS -b /tmp/publikator-cookies.txt \
            -X PUT \
            -H 'content-type: application/json' \
            -d "{\"mediaIds\":[\"${MEDIA_2}\",\"${MEDIA_1}\"]}" \
            "http://127.0.0.1:18080/api/posts/${POST_ID}/media-order" | \
            jq -e --arg first "$MEDIA_2" --arg second "$MEDIA_1" '.ok == true and .media[0].id == $first and .media[0].sort_order == 0 and .media[1].id == $second and .media[1].sort_order == 1'

          curl -fsS -b /tmp/publikator-cookies.txt -X POST \
            "http://127.0.0.1:18080/api/posts/${POST_ID}/ready" | jq -e '.ok == true'

          curl -fsS -b /tmp/publikator-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"platform":"max","name":"CI MAX","credentials":{"accessToken":"fake-max-token","chatId":"-100500"}}' \
            http://127.0.0.1:18080/api/accounts | jq -e '.id != null'

          PREFLIGHT_POST_ID="$(curl -fsS -b /tmp/publikator-cookies.txt \
            -H 'content-type: application/json' \
            -d "{\"projectId\":\"${PROJECT_ID}\",\"title\":\"Preflight post\",\"body\":\"Must be blocked without public HTTPS media URL\",\"scheduleMode\":\"MANUAL\"}" \
            http://127.0.0.1:18080/api/posts | jq -er '.id')"

          curl -fsS -b /tmp/publikator-cookies.txt \
            -F 'file=@/tmp/publikator-white.png;type=image/png' \
            "http://127.0.0.1:18080/api/posts/${PREFLIGHT_POST_ID}/media" | jq -e '.id != null'

          STATUS="$(curl -sS -o /tmp/publikator-preflight.json -w '%{http_code}' \
            -b /tmp/publikator-cookies.txt -X POST \
            "http://127.0.0.1:18080/api/posts/${PREFLIGHT_POST_ID}/ready")"
          test "$STATUS" = "409"
          jq -e '.issues | any(.platform == "max")' /tmp/publikator-preflight.json

          BUNDLE_NAME="$(curl -fsS -b /tmp/publikator-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"label":"ci"}' \
            http://127.0.0.1:18080/api/backup-bundles | jq -er 'select(.sizeBytes > 0) | .name')"
          test "${BUNDLE_NAME##*.}" = "tgz"

          curl -fsS -b /tmp/publikator-cookies.txt \
            "http://127.0.0.1:18080/api/backup-bundles/${BUNDLE_NAME}/download" \
            -o /tmp/publikator-full.tgz
          test -s /tmp/publikator-full.tgz
          rm -rf /tmp/publikator-bundle-check
          mkdir -p /tmp/publikator-bundle-check
          tar -xzf /tmp/publikator-full.tgz -C /tmp/publikator-bundle-check
          jq -e '.format == "publikator-backup" and .formatVersion == 1 and .schemaVersion == 1 and .counts.media >= 3 and (.mediaFiles | length) >= 3' /tmp/publikator-bundle-check/manifest.json
          ! grep -F 'ci-master-key-that-is-longer-than-32-characters' /tmp/publikator-bundle-check/manifest.json

          set +e
          DATA_DIR=/tmp/publikator-wrong-key \
          ADMIN_PASSWORD=ci-password \
          APP_MASTER_KEY=wrong-ci-master-key-that-is-longer-than-32-characters \
          node --input-type=module <<'NODE' >/tmp/publikator-wrong-key.out 2>&1
          import { validateBackupDirectory } from './dist/backup-format.js';
          await validateBackupDirectory('/tmp/publikator-bundle-check');
          NODE
          WRONG_KEY_EXIT=$?
          set -e
          test "$WRONG_KEY_EXIT" -ne 0
          grep -F 'APP_MASTER_KEY' /tmp/publikator-wrong-key.out

          EXTRA_PROJECT_ID="$(curl -fsS -b /tmp/publikator-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"name":"After backup mutation","slug":"after-backup-mutation"}' \
            http://127.0.0.1:18080/api/projects | jq -er '.id')"
          EXTRA_POST_ID="$(curl -fsS -b /tmp/publikator-cookies.txt \
            -H 'content-type: application/json' \
            -d "{\"projectId\":\"${EXTRA_PROJECT_ID}\",\"title\":\"Must disappear after restore\",\"body\":\"Created after backup\",\"scheduleMode\":\"MANUAL\"}" \
            http://127.0.0.1:18080/api/posts | jq -er '.id')"
          EXTRA_MEDIA_PATH="$(curl -fsS -b /tmp/publikator-cookies.txt \
            -F 'file=@/tmp/publikator-yellow.png;type=image/png' \
            "http://127.0.0.1:18080/api/posts/${EXTRA_POST_ID}/media" | jq -er '.relative_path')"
          curl -fsS "http://127.0.0.1:18080/public-media/${EXTRA_MEDIA_PATH}" -o /dev/null

          NO_CONFIRM_STATUS="$(curl -sS -o /tmp/publikator-no-confirm.json -w '%{http_code}' \
            -b /tmp/publikator-cookies.txt -X POST \
            "http://127.0.0.1:18080/api/backup-bundles/${BUNDLE_NAME}/restore")"
          test "$NO_CONFIRM_STATUS" = "400"
          jq -e '.error | contains("RESTORE")' /tmp/publikator-no-confirm.json

          RESTART_BEFORE="$(docker inspect -f '{{.RestartCount}}' publikator-smoke)"
          curl -fsS -b /tmp/publikator-cookies.txt \
            -H 'x-publikator-restore: RESTORE' \
            -F 'file=@/tmp/publikator-full.tgz;type=application/gzip' \
            http://127.0.0.1:18080/api/backup-bundles/restore-upload | \
            tee /tmp/publikator-restore.json | \
            jq -e '.ok == true and .restart == true and .manifest.format == "publikator-backup" and (.preRestoreBackup.name | contains("pre-restore"))'

          RESTORED=0
          for i in $(seq 1 50); do
            RESTART_AFTER="$(docker inspect -f '{{.RestartCount}}' publikator-smoke 2>/dev/null || echo 0)"
            if [ "$RESTART_AFTER" -gt "$RESTART_BEFORE" ] && curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1; then
              RESTORED=1
              break
            fi
            sleep 1
          done
          if [ "$RESTORED" != "1" ]; then
            docker logs publikator-smoke
            exit 1
          fi

          login
          curl -fsS -b /tmp/publikator-cookies.txt http://127.0.0.1:18080/api/projects | \
            jq -e --arg id "$EXTRA_PROJECT_ID" 'all(.[]; .id != $id)'

          EXTRA_POST_STATUS="$(curl -sS -o /tmp/publikator-extra-post.json -w '%{http_code}' \
            -b /tmp/publikator-cookies.txt "http://127.0.0.1:18080/api/posts/${EXTRA_POST_ID}")"
          test "$EXTRA_POST_STATUS" = "404"

          EXTRA_MEDIA_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/public-media/${EXTRA_MEDIA_PATH}")"
          test "$EXTRA_MEDIA_STATUS" = "404"

          curl -fsS -b /tmp/publikator-cookies.txt "http://127.0.0.1:18080/api/posts/${POST_ID}" | \
            jq -e --arg first "$MEDIA_2" '.status == "READY" and (.media | length) == 2 and .media[0].id == $first and any(.targets[]; .platform == "telegram" and .enabled == 1 and .override_text == "Telegram CI override") and any(.targets[]; .platform == "max" and .enabled == 0)'

          curl -fsS -b /tmp/publikator-cookies.txt http://127.0.0.1:18080/api/backup-bundles | \
            jq -e 'any(.[]; .name | contains("pre-restore"))'
