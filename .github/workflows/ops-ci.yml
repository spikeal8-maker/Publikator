name: Ops hardening CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ops-hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node --check public/ops-v07.js
      - name: Mock publisher, recovery, scheduler, retention and diagnostics E2E
        run: node scripts/v07-mock-e2e.mjs
      - name: Authenticated HTTP CRUD E2E with mock publisher
        run: node scripts/v07-http-e2e.mjs
      - name: Browser origin, security headers and trusted proxy E2E
        run: node scripts/browser-security-e2e.mjs
