name: One-shot FE-004 preflight

on:
  push:
    branches:
      - fe-004/schedule-modal-ownership

permissions:
  contents: read

jobs:
  preflight:
    name: FE-004 focused and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: CX3-014 focused regression
        run: node scripts/cx3-014-unified-operator-ui-e2e.mjs

      - name: Browser acceptance
        run: npm run test:browser
