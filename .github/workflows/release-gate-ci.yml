name: Release gate CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      ADMIN_PASSWORD: ci-release-password
      APP_MASTER_KEY: ci-release-master-key-value-longer-than-thirty-two-characters
      PUBLIC_BASE_URL: https://publisher.example.test
      APP_BUILD_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      RELEASE_TARGET_VERSION: 1.0.0
      EVENT_RETENTION_DAYS: 0
      BACKUP_RETENTION_COUNT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node --check public/release-v08.js
      - name: Release evidence and backup E2E
        run: node scripts/v08-release-gate-e2e.mjs
