name: One-shot FE-006A review fix

on:
  push:
    branches:
      - fe-006a/library-controls-ownership

permissions:
  contents: read

jobs:
  source:
    name: FE-006A source and CX3-002
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: CX3-002 content library
        run: node scripts/cx3-002-content-library-e2e.mjs

  cx3:
    name: FE-006A CX3-014
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: CX3-014 unified operator UI
        run: node scripts/cx3-014-unified-operator-ui-e2e.mjs

  browser:
    name: FE-006A browser wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Browser acceptance
        run: npm run test:browser
