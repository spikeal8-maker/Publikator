name: One-time Publikator image transfer
on:
  push:
    branches: [codex/1panel-image-transfer-2b6c6a22]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2b6c6a2246db99af3da8f25d6905ee0ae0631c7f
      - name: Build and verify the accepted release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2b6c6a2246db99af3da8f25d6905ee0ae0631c7f'
          docker build --build-arg BUILD_SHA=2b6c6a2246db99af3da8f25d6905ee0ae0631c7f -t publikator-live:2b6c6a22 .
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' publikator-live:2b6c6a22)" = '2b6c6a2246db99af3da8f25d6905ee0ae0631c7f'
          docker run --rm --network none --entrypoint node publikator-live:2b6c6a22 -e 'if(process.getuid()===0||process.env.IMAGE_BUILD_SHA!=="2b6c6a2246db99af3da8f25d6905ee0ae0631c7f")process.exit(1)'
          docker run --rm --network none --entrypoint ffmpeg publikator-live:2b6c6a22 -version >/dev/null
      - name: Export and checksum the image
        run: |
          set -euo pipefail
          docker save publikator-live:2b6c6a22 | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publikator-1panel-2b6c6a22
          path: image.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
