name: One-shot FE-007 preflight

on:
  push:
    branches:
      - fe-007/eliminate-page-polish-runtime

concurrency:
  group: fe-007-preflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    name: FE-007 focused contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Content domain M1
        run: node scripts/content-domain-m1-e2e.mjs
      - name: Editorial state concurrency
        run: node scripts/state-concurrency-m1-e2e.mjs
      - name: Content Inspector
        run: node scripts/ew4-001-e2e.mjs
      - name: Calendar CX3-001
        run: node scripts/cx3-001-calendar-e2e.mjs
      - name: Library CX3-002
        run: node scripts/cx3-002-content-library-e2e.mjs
      - name: Operator pages CX3-013
        run: node scripts/cx3-013-operator-pages-e2e.mjs

  architecture:
    name: FE-007 architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: CX3-014 unified operator UI
        run: node scripts/cx3-014-unified-operator-ui-e2e.mjs

  browser:
    name: FE-007 browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Browser acceptance
        run: npm run test:browser
