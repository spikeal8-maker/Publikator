name: Publikator CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLIKATOR_TEST_ADMIN_PASSWORD: acceptance-password-value
      PUBLIKATOR_TEST_MASTER_KEY: acceptance-master-key-value-longer-than-thirty-two-characters
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: Provision host video tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libx264'
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libx265'

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          find public -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Lockfile and pinned Docker base identity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum package-lock.json
          grep -F 'node:22.23.2-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5' Dockerfile

      - name: Legacy media migration
        run: node scripts/legacy-media-migration-e2e.mjs

      - name: Schema v3 and unique schedule migration
        run: node scripts/schema-v3-e2e.mjs

      - name: Content domain M1 contract
        run: node scripts/content-domain-m1-e2e.mjs

      - name: Schema v4 content versioning migration
        run: node scripts/schema-v4-content-versioning-e2e.mjs

      - name: Schema v5 ingestion provenance migration
        run: node scripts/schema-v5-ingestion-provenance-e2e.mjs

      - name: Schema v6 ingestion security migration
        run: node scripts/schema-v6-ingestion-security-e2e.mjs

      - name: M0-004 ingestion security guards
        run: node scripts/m004-e2e.mjs

      - name: Schema v7 time rendition sequence migration
        run: node scripts/schema-v7-time-rendition-sequence-e2e.mjs

      - name: Schema v8 rich media migration
        run: node scripts/schema-v8-rich-media-e2e.mjs

      - name: M0-005 time rendition sequence semantics
        run: node scripts/m005-e2e.mjs

      - name: M0-006 release and migration policy
        run: node scripts/m006-release-migration-policy-e2e.mjs

      - name: Editorial state and immutable revision concurrency
        run: node scripts/state-concurrency-m1-e2e.mjs

      - name: EW4-001 safe lifecycle and Content Inspector
        run: node scripts/ew4-001-e2e.mjs

      - name: CX3-001 visual calendar shell
        run: node scripts/cx3-001-calendar-e2e.mjs

      - name: CX3-002 content library UX
        run: node scripts/cx3-002-content-library-e2e.mjs

      - name: CX3-003 rich media data model
        run: node scripts/cx3-003-rich-media-e2e.mjs

      - name: CX3-004 media viewer player
        run: node scripts/cx3-004-media-viewer-e2e.mjs

      - name: CX3-005 platform capability preflight
        run: node scripts/cx3-005-capability-preflight-e2e.mjs

      - name: CX3-006 platform previews v2
        run: node scripts/cx3-006-platform-previews-e2e.mjs

      - name: CX3-007 dashboard API semantics
        run: node scripts/cx3-007-dashboard-api-e2e.mjs

      - name: CX3-007 contrast UI contract
        run: node scripts/cx3-007-contrast-ui-e2e.mjs

      - name: CX3-008A production video media pipeline
        run: node scripts/cx3-008a-video-media-e2e.mjs

      - name: Publisher recovery and operations
        run: node scripts/v07-mock-e2e.mjs

      - name: Authenticated HTTP CRUD
        run: node scripts/v07-http-e2e.mjs

      - name: Browser origin and trusted-proxy security
        run: node scripts/browser-security-e2e.mjs

      - name: Scheduler reliability
        run: node scripts/runtime-reliability-e2e.mjs

      - name: Atomic publication concurrency
        run: node scripts/publication-concurrency-e2e.mjs

      - name: Telegram adapter safety
        run: node scripts/telegram-adapter-e2e.mjs

      - name: VK adapter safety
        run: node scripts/vk-adapter-e2e.mjs

      - name: MAX adapter safety
        run: node scripts/max-adapter-e2e.mjs

      - name: Instagram adapter readiness
        env:
          NODE_ENV: test
        run: node scripts/instagram-adapter-e2e.mjs

      - name: CX3-011A Instagram Short Reel
        env:
          NODE_ENV: test
        run: node scripts/cx3-011a-instagram-short-e2e.mjs

      - name: CX3-011B Instagram Short live acceptance gate contract
        run: node scripts/cx3-011b-instagram-short-live-acceptance-e2e.mjs

      - name: CX3-008F live video acceptance gate contract
        run: node scripts/cx3-008f-live-acceptance-e2e.mjs

      - name: Content plan CSV/XLSX roundtrip
        run: node scripts/content-plan-e2e.mjs

      - name: Content plan v3 idempotency and conflict contract
        run: node scripts/content-plan-v3-e2e.mjs

      - name: CP2-005 Google Sheets connector
        run: node scripts/cp2-005-google-sheets-e2e.mjs

      - name: CP2-006A Google Drive media binding
        run: node scripts/cp2-006a-google-drive-media-e2e.mjs

      - name: CP2-006B Yandex Disk media binding
        run: node scripts/cp2-006b-yandex-disk-media-e2e.mjs

      - name: CP2-006C canonical source template
        run: node scripts/cp2-006c-source-template-e2e.mjs

      - name: CP2-007A Google Sheets Preview-only polling
        run: node scripts/cp2-007a-google-sheets-preview-polling-e2e.mjs

      - name: CX3-012 operator quick start workflow
        run: node scripts/cx3-012-operator-quick-start-e2e.mjs

      - name: CX3-013 routed operator pages
        run: node scripts/cx3-013-operator-pages-e2e.mjs

      - name: CX3-014 unified operator UI
        run: node scripts/cx3-014-unified-operator-ui-e2e.mjs

      - name: Schema v4 content versioning backup and restore
        run: node scripts/backup-v4-content-versioning-e2e.mjs

      - name: Schema v5 provenance backup and restore
        run: node scripts/backup-v5-provenance-e2e.mjs

      - name: Schema v6 security state backup and restore
        run: node scripts/backup-v6-e2e.mjs

      - name: Schema v7 time rendition sequence backup and restore
        run: node scripts/backup-v7-e2e.mjs

      - name: Schema v8 rich media backup and restore
        run: node scripts/backup-v8-rich-media-e2e.mjs

      - name: Canonical backup API
        env:
          NODE_ENV: test
          ADMIN_PASSWORD: backup-api-password
          APP_MASTER_KEY: backup-api-master-key-value-longer-than-thirty-two-characters
          PUBLIC_BASE_URL: https://publisher.example.test
          EVENT_RETENTION_DAYS: 0
          BACKUP_RETENTION_COUNT: 0
        run: node scripts/v081-backup-path-e2e.mjs

      - name: Release gate evidence
        env:
          NODE_ENV: test
          ADMIN_PASSWORD: release-gate-password
          APP_MASTER_KEY: release-gate-master-key-value-longer-than-thirty-two-characters
          PUBLIC_BASE_URL: https://publisher.example.test
          APP_BUILD_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RELEASE_TARGET_VERSION: 1.0.0
          EVENT_RETENTION_DAYS: 0
          BACKUP_RETENTION_COUNT: 0
        run: node scripts/v08-release-gate-e2e.mjs

      - name: Build image with immutable tested revision
        run: docker build --pull=false --build-arg BUILD_SHA="${GITHUB_SHA}" -t publikator-release-identity .

      - name: Verify baked image revision, video tools and non-root runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint node publikator-release-identity --version)" = 'v22.23.2'
          docker run --rm --entrypoint ffmpeg publikator-release-identity -version >/dev/null
          docker run --rm --entrypoint ffprobe publikator-release-identity -version >/dev/null
          BAKED_SHA="$(docker run --rm --entrypoint node publikator-release-identity -e 'process.stdout.write(process.env.IMAGE_BUILD_SHA || "")')"
          test "$BAKED_SHA" = "$GITHUB_SHA"
          LABEL_SHA="$(docker image inspect publikator-release-identity --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$LABEL_SHA" = "$GITHUB_SHA"
          RUNTIME_UID="$(docker run --rm --entrypoint node publikator-release-identity -e 'process.stdout.write(String(process.getuid?.() ?? -1))')"
          test "$RUNTIME_UID" != '0'
          test "$RUNTIME_UID" != '-1'
          echo "Baked revision: $BAKED_SHA"
          echo "Runtime uid: $RUNTIME_UID"

      - name: Health exposes baked build identity
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f publikator-health-identity >/dev/null 2>&1 || true
          trap 'docker rm -f publikator-health-identity >/dev/null 2>&1 || true' EXIT
          docker run -d --name publikator-health-identity -p 18082:8080 \
            -e ADMIN_PASSWORD="$PUBLIKATOR_TEST_ADMIN_PASSWORD" \
            -e APP_MASTER_KEY="$PUBLIKATOR_TEST_MASTER_KEY" \
            publikator-release-identity >/dev/null
          for _ in $(seq 1 40); do
            HEALTH="$(curl -fsS http://127.0.0.1:18082/api/health 2>/dev/null || true)"
            if [ -n "$HEALTH" ]; then break; fi
            sleep 1
          done
          jq -e --arg sha "$GITHUB_SHA" '.ok == true and .buildSha == $sha and .schemaVersion == 8' <<<"$HEALTH"

      - name: Linux documented deployment launcher
        run: bash scripts/deploy-linux-e2e.sh

      - name: Cross-platform Compose fresh install
        run: bash scripts/compose-fresh-install-e2e.sh

      - name: Production Docker and full restore
        run: bash scripts/core-docker-restore-e2e.sh

      - name: Acceptance passed
        run: echo 'Publikator acceptance passed'
