name: CX3-008A Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused:
    name: Video pipeline focused phases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Canonical upload and snapshot
        run: node scripts/cx3-008a-video-media-e2e.mjs upload
      - name: Rejection and size limits
        run: node scripts/cx3-008a-video-media-e2e.mjs rejection
      - name: Delete and temp cleanup
        run: node scripts/cx3-008a-video-media-e2e.mjs full
