name: One-time RC metadata sync

on:
  push:
    branches: [stabilize/v1-rc1]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: stabilize/v1-rc1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Synchronize package and lockfile version
        run: npm version 1.0.0-rc.1 --no-git-tag-version
      - name: Remove this one-time workflow and commit metadata
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/release-metadata-sync.yml
          git config user.name 'Publikator Release Bot'
          git config user.email 'publikator-release-bot@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/release-metadata-sync.yml
          git commit -m 'Prepare package metadata for 1.0.0-rc.1'
          git push origin HEAD:stabilize/v1-rc1
