function save(status){pullEditor();if(!editing)return;const p=editing;if(!p.text.trim()){toast("Введите текст или заметку");return}if(p.day!==null&&(!Number.isInteger(p.day)||p.day<1||p.day>30)){toast("Выберите день ноября от 1 до 30");return}if(["planned","now"].includes(status)&&((status==="planned"&&(!p.day||!p.time))||!p.targets.length||["Короткое видео","История"].includes(p.format))){toast("Нужны дата, время, адресаты и поддерживаемый формат");return}if(status==="planned"&&!confirm("ДЕМО: подтвердить план "+p.day+".11 "+p.time+" для "+p.targets.map(i=>accounts[i]).join(", ")+"? Ничего не будет отправлено."))return;if(status==="now"){if(!confirm("ДЕМО: проверить отправку для "+p.targets.map(i=>accounts[i]).join(", ")+"? Реальной отправки не будет."))return;status="review"}p.status=status;p.title=p.text.trim().split("\n")[0].slice(0,72);if(!p.id)p.id=Math.max(0,...posts.map(q=>q.id))+1;posts=posts.filter(q=>q.id!==p.id).concat(p);closeModal(true);render();toast("Демо: "+states[status]+". Данные только в памяти браузера.")}

function modelsetup(task){openModal('<header class="dialogheader"><h2 class="grow">Подключение модели</h2><button data-action="closemodal">✕</button></header><div class="confirmbody stack"><div class="notice warning">Демонстрация формы. Не вводите реальные ключи, токены или адреса.</div><label>Задача<select>'+opts(["Текст","Изображение","Видео","Анализ файлов"].map(x=>[x,x]),task||"Текст")+'</select></label><label>Тип<select><option>Локальный</option><option>Облачный</option></select></label><label>Провайдер<select><option>Ollama</option><option>llama.cpp</option><option>Совместимый API</option><option>ComfyUI (кандидат)</option></select></label><label>Пример модели<input readonly value="demo-model"></label><div class="notice">Проверки: доступность сервера → список моделей → ответ → инструменты / генерация. В демо не выполняются.</div></div><footer class="dialogfooter"><button data-action="closemodal">Закрыть</button><button class="primary" data-action="demo" data-value="Это макет: проверка и сохранение реального подключения не выполнялись">Проверить и сохранить</button></footer>',true)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;if(b.dataset.nav){goto(b.dataset.nav);return}const a=b.dataset.action,v=b.dataset.value;switch(a){case"new":openEditor(null,page==="calendar"?day:null);break;case"more":openModal('<header class="dialogheader"><h2 class="grow">Ещё</h2><button data-action="closemodal">✕</button></header><div class="confirmbody stack"><button data-action="moregoto" data-value="analytics">Аналитика</button><button data-action="moregoto" data-value="settings">Настройки</button></div>',true);break;case"moregoto":closeModal(true);goto(v);break;case"duplicate":{const p=posts.find(x=>x.id===+v);closeModal(true);openEditor(null,null,{text:p.text,format:p.format,assets:[...p.assets],targets:[...p.targets],project:p.project});break;}case"newday":openEditor(null,+v);break;case"edit":openEditor(+v);break;case"detail":inspector={type:"post",id:+v};render();break;case"day":day=+v;inspector={type:"day"};render();break;case"shift":day=Math.max(1,Math.min(30,day+(mode==="week"?7:1)*(+v)));inspector=null;render();break;case"today":day=24;mode=innerWidth<768?"day":"week";inspector=null;render();break;case"mode":mode=v;inspector=null;render();break;case"filter":filter=v;render();break;case"stat":filter=v;inspector=v==="all"?{type:"day"}:{type:"filter"};if(v==="all")day=24;render();break;case"attention":if(page!=="calendar")goto("calendar");inspector={type:"attention"};render();break;case"closepanel":inspector=null;render();break;case"mediaTab":mediaTab=v;render();break;case"asset":openEditor(null,day,{assets:[+v]});break;case"template":openEditor(null,day,{text:"Тема: \nЧто узнаем: \nПрактическое задание: "});break;case"media-ai":goto("ai");$("#chatinput").value="Подготовь иллюстрацию 4:5";break;case"newchat":chats[project]=[];chat=chats[project];render();break;case"prompt":$("#chatinput").value=v;break;case"sendchat":{let t=$("#chatinput").value.trim();if(!t)return;chat.push({role:"user",text:t},/план|недел/i.test(t)?{role:"bot",text:"ДЕМО: предлагаю семь материалов. Выберите нужные строки, измените даты и получателей. Сохранение создаст только черновики, не расписание отправки.",plan:++planSequence}:{role:"bot",text:"ДЕМО-ответ: здесь будет текст, результат генерации или план с проверяемыми действиями. Ни одна модель не вызвана.",draft:true});render();break}case"openplan":openPlan(+v);break;case"applyplan":applyPlan(+v);break;case"chatdraft":openEditor(null,day,{text:"Демонстрационный пост об Arduino. Исследуем микроконтроллер и создаём простой эксперимент.",assets:[0]});break;case"models":goto("settings");settings="Модели ИИ";render();break;case"setting":settings=v;render();break;case"modelsetup":modelsetup(v);break;case"closemodal":closeModal();break;case"pane":$("#modal .editgrid").dataset.pane=v;$("#modal .editorpane").innerHTML=tabs([["edit","Редактировать"],["preview","Предпросмотр"]],v,"pane");break;case"suggesttext":$("#edittext").value+=($("#edittext").value?"\n\n":"")+"Демо-предложение: познакомимся с Arduino и проведём простой эксперимент.";refreshEditor();break;case"pickasset":{const i=assets.findIndex((x,i)=>x.project===editing.project&&!editing.assets.includes(i));if(i<0){toast("Все демо-медиа проекта добавлены");return}editing.assets.push(i);refreshEditor();break}case"removeasset":editing.assets=editing.assets.filter(i=>i!==+v);refreshEditor();break;case"savedraft":save("draft");break;case"saveintent":save($("#intent").value);break;case"demo":toast(v);break}});
document.addEventListener("change",e=>{const id=e.target.id;if(["project","mobileproject"].includes(id)){project=+e.target.value;chat=chats[project];filter="all";platform="all";formatFilter="all";inspector=null;render()}else if(id==="platform"){platform=e.target.value;render()}else if(id==="formatfilter"){formatFilter=e.target.value;render()}else if(id==="statusfilter"){filter=e.target.value;render()}else if(id==="dayselect"){day=+e.target.value;render()}else if(e.target.closest("#modal")&&editing)refreshEditor()});
document.addEventListener("input",e=>{if(e.target.id==="edittext")refreshEditor()});
document.addEventListener("keydown",e=>{if($("#modal").hidden)return;if(e.key==="Escape")closeModal();if(e.key==="Tab"){const focusable=[...$("#modal").querySelectorAll('button:not(:disabled),input:not([readonly]),select,textarea')].filter(x=>x.getClientRects().length);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script></body></html>
