                }
              },
              "required": [
                "contentFormat"
              ]
            },
            "then": {
              "required": [
                "bodyPlain"
              ],
              "properties": {
                "bodyPlain": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 20000
                },
                "mediaAssetIds": {
                  "type": "array",
                  "maxItems": 0
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "contentFormat": {
                  "enum": [
                    "IMAGE",
                    "CAROUSEL",
