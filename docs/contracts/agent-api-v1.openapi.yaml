            "minItems": 0,
            "maxItems": 100,
            "uniqueItems": true
          },
          "targetTextOverrides": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "accountId",
                "bodyPlain"
              ],
              "properties": {
                "accountId": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128,
                  "pattern": "^[A-Za-z0-9._:-]+$"
                },
                "bodyPlain": {
                  "type": "string",
                  "minLength": 0,
                  "maxLength": 20000
                }
              },
              "additionalProperties": false
            },
            "minItems": 0,
            "maxItems": 100
          },
          "schedule": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/Schedule"
              },
              {
                "type": "null"
              }
