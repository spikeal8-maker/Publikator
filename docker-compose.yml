services:
  publikator:
    build:
      context: .
      args:
        BUILD_SHA: "${BUILD_SHA:-unknown}"
    container_name: publikator
    restart: unless-stopped
    ports:
      - "${PUBLIKATOR_BIND:-127.0.0.1}:${PUBLIKATOR_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
      TRUST_PROXY: "${TRUST_PROXY:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      APP_MASTER_KEY: "${APP_MASTER_KEY}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-24}"
      SCHEDULER_INTERVAL_MS: "${SCHEDULER_INTERVAL_MS:-15000}"
      QUEUE_SLOT_GRACE_MINUTES: "${QUEUE_SLOT_GRACE_MINUTES:-60}"
      EVENT_RETENTION_DAYS: "${EVENT_RETENTION_DAYS:-180}"
      BACKUP_RETENTION_COUNT: "${BACKUP_RETENTION_COUNT:-30}"
      MAX_IMAGE_BYTES: "${MAX_IMAGE_BYTES:-52428800}"
      MAX_VIDEO_BYTES: "${MAX_VIDEO_BYTES:-536870912}"
      MAX_BUNDLE_UPLOAD_BYTES: "${MAX_BUNDLE_UPLOAD_BYTES:-536870912}"
      MAX_BUNDLE_EXPANDED_BYTES: "${MAX_BUNDLE_EXPANDED_BYTES:-2147483648}"
      MAX_BUNDLE_MEDIA_FILES: "${MAX_BUNDLE_MEDIA_FILES:-1000}"
      MEDIA_PROCESSING_TIMEOUT_MS: "${MEDIA_PROCESSING_TIMEOUT_MS:-120000}"
      MEDIA_TEMP_BUDGET_BYTES: "${MEDIA_TEMP_BUDGET_BYTES:-1073741824}"
      FFMPEG_PATH: "${FFMPEG_PATH:-ffmpeg}"
      FFPROBE_PATH: "${FFPROBE_PATH:-ffprobe}"
      RELEASE_TARGET_VERSION: "${RELEASE_TARGET_VERSION:-1.0.0}"
    volumes:
      - "${PUBLIKATOR_DATA_SOURCE:-publikator-data}:/app/data"

volumes:
  publikator-data:
