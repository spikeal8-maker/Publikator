<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Publikator — публикация контента</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3777fa"/>
      <stop offset=".52" stop-color="#2455d2"/>
      <stop offset="1" stop-color="#102451"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6df1f4"/>
      <stop offset="1" stop-color="#20a9f6"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".16"/>
  <!-- A document forms the stem and bowl of a distinctive publication mark. -->
  <path d="M17 11h23l8 8v28a5 5 0 0 1-5 5H17a5 5 0 0 1-5-5V16a5 5 0 0 1 5-5Z" fill="#fff"/>
  <path d="M40 11v5a3 3 0 0 0 3 3h5" fill="#dceaff"/>
  <path d="M19 24h18M19 30h14" fill="none" stroke="#738eae" stroke-width="3.1" stroke-linecap="round"/>
  <!-- Sending is represented by a single bold, readable plane. -->
  <path d="M23 40 55 26 44 55l-8.5-11-9 3Z" fill="url(#plane)" stroke="#0e4dbd" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M35.5 44 55 26 38.5 47.8 44 55Z" fill="#117ddb"/>
  <path d="M35.5 44 55 26 23 40" fill="none" stroke="#c6fdff" stroke-opacity=".9" stroke-width="1.25" stroke-linejoin="round"/>
</svg>
