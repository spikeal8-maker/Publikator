<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Publikator</title>
  <meta name="theme-color" content="#2455d2">
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=pk-1">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=pk-1">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=pk-1">
  <link rel="manifest" href="/site.webmanifest?v=pk-1">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/media-v05.css">
  <link rel="stylesheet" href="/backups-v06.css">
  <link rel="stylesheet" href="/content-plan-v06b.css">
  <link rel="stylesheet" href="/ops-v07.css">
  <link rel="stylesheet" href="/release-v08.css">
  <link rel="stylesheet" href="/editorial-v4.css">
  <link rel="stylesheet" href="/media-viewer-v3.css">
  <link rel="stylesheet" href="/platform-previews-v3.css">
  <link rel="stylesheet" href="/calendar-v3.css">
  <link rel="stylesheet" href="/content-library-v3.css">
  <link rel="stylesheet" href="/theme-v3.css">
  <link rel="stylesheet" href="/dashboard-v3.css">
  <link rel="stylesheet" href="/video-authoring-v3.css">
  <link rel="stylesheet" href="/operator-pages-v4.css">
  <link rel="stylesheet" href="/google-sheets-v1.css">
  <link rel="stylesheet" href="/ui-v5.css">
  <link rel="stylesheet" href="/quick-composer-v1.css">
  <link rel="stylesheet" href="/rich-text-editor-v1.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <div id="login" class="center-card auth-screen hidden">
    <div class="auth-mark" aria-hidden="true">P</div>
    <h1 id="auth-heading">Вход в Publikator</h1>
    <p id="auth-subtitle">Введите логин и пароль, чтобы продолжить работу.</p>

    <form id="login-form" class="hidden" autocomplete="on">
      <label id="login-username-row">Логин
        <input id="username" name="username" autocomplete="username" minlength="3" maxlength="48" required>
      </label>
      <label>Пароль
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Войти</button>
    </form>

    <form id="setup-form" class="hidden" autocomplete="on">
      <label>Логин администратора
        <input id="setup-username" name="username" autocomplete="username" minlength="3" maxlength="48" required>
      </label>
      <label>Пароль
        <input id="setup-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
      </label>
      <label>Повтор пароля
        <input id="setup-confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
      </label>
      <button type="submit" id="setup-submit">Создать аккаунт</button>
    </form>
    <div id="setup-help" class="hidden" role="status"></div>
    <div id="login-error" class="error" role="alert" aria-live="polite"></div>
    <div id="auth-bottom">Publikator · управление публикациями</div>
  </div>

  <div id="app" class="hidden shell">
    <aside>
      <div class="brand">Publikator</div>
      <button id="quick-compose-nav" type="button">+ Создать публикацию</button>
      <div class="nav-group-label">Работа</div>
      <button class="nav active" data-view="dashboard" data-route="/overview">Обзор</button>
      <button id="calendar-nav" class="nav" data-route="/calendar">Календарь</button>
      <button class="nav" data-view="posts" data-route="/content">Публикации</button>
      <button id="content-library-nav" class="nav" data-route="/library">Библиотека</button>
      <button id="templates-nav" class="nav" data-route="/templates">Шаблоны</button>
      <button class="nav" data-view="projects" data-route="/projects">Проекты</button>
      <button id="socials-nav" class="nav" data-route="/socials">Соцсети</button>
      <button id="sources-nav" class="nav" data-route="/sources">Источники / Интеграции</button>
      <button class="nav" data-view="schedules" data-route="/schedule">Расписание</button>
      <div class="nav-group-label">Система</div>
      <button class="nav nav-system" data-view="events" data-route="/journal">Журнал</button>
      <button class="nav nav-system" data-view="backups" data-route="/backups">Резервные копии</button>
      <button id="diagnostics-nav" class="nav nav-system" data-route="/diagnostics">Диагностика</button>
      <button id="account-nav" class="nav nav-system" data-view="account">Учётная запись</button>
      <button id="logout" class="nav bottom">Выйти</button>
    </aside>
    <main>
      <header><h1 id="page-title">Обзор</h1><button id="legacy-migration-note" class="hidden" type="button">Создать личный логин</button><div id="status-line"></div></header>
      <section id="view"></section>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/quick-composer-v1.js"></script>
  <script type="module" src="/post-editor-v04.js"></script>
  <script type="module" src="/video-authoring-v3.js"></script>
  <script type="module" src="/media-viewer-v3.js"></script>
  <script type="module" src="/platform-previews-v3.js"></script>
  <script type="module" src="/editorial-v4.js"></script>
  <script type="module" src="/calendar-v3.js"></script>
  <script type="module" src="/content-library-v3.js"></script>
  <script type="module" src="/dashboard-v3.js"></script>
  <script type="module" src="/operator-pages-v4.js"></script>
  <script type="module" src="/google-sheets-v1.js"></script>
  <script type="module" src="/backups-v06.js"></script>
  <script type="module" src="/backups-v081.js"></script>
  <script type="module" src="/content-plan-v06b.js"></script>
  <script type="module" src="/ops-v07.js"></script>
  <script type="module" src="/release-v08.js"></script>
  <script type="module" src="/ui-v5.js"></script>
</body>
</html>
